<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1778" viewBox="0 0 1600 1778" role="img" aria-labelledby="title desc">
  <title id="title">Bot Group Chats beyond Desktop: the path to production</title>
  <desc id="desc">A widening stack of seven layers, built from the bottom up. Shared history, single-gateway execution and cross-gateway work have landed. The Desktop client, Files and Bot-to-Bot handoff, and messaging controls have separate review paths. Layer 7 aims to keep work going when a host goes offline. Its history and task-record copies are implemented in PRs 104601 and 104759; automatic recovery on another host is not enabled yet. The complete integration draft is PR 98307.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#273e38" flood-opacity=".07"/></filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .heading { font-size: 34px; font-weight: 700; fill: #273039; }
      .body { font-size: 26px; fill: #56616b; }
      .ref { font-size: 24px; fill: #3b6657; }
      .number { font-size: 25px; font-weight: 700; }
      .status { font-size: 21px; font-weight: 700; }
      .line { stroke: #c9d3db; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="1600" height="1778" fill="#f8fafb"/>
  <text x="80" y="92" font-size="52" font-weight="700" fill="#273039">Bot Group Chats, beyond Desktop</text>
  <text x="80" y="143" font-size="28" fill="#56616b">Shared work. Real files. Pick up from another device.</text>

  <g id="layer-seven">
    <g filter="url(#shadow)"><rect x="350" y="198" width="900" height="210" rx="8" fill="#ffffff" stroke="#d3ddd8"/></g>
    <rect x="379" y="229" width="40" height="40" rx="6" fill="#e6f0f5"/>
    <text x="392" y="258" class="number" fill="#386c87">7</text>
    <text x="442" y="259" font-size="34" font-weight="700" fill="#273039">Keep working when a host goes offline</text>
    <text x="379" y="303" class="body">Preserve history and task records on other gateways.</text>
    <text x="379" y="342" class="ref">#104601 + #104759  /  Under review</text>
    <text x="379" y="382" font-size="24" fill="#56616b">In progress: automatic recovery is not enabled yet.</text>
  </g>

  <g transform="translate(0 88)">
  <path class="line" d="M800 320V340M800 464V488M800 488H540V516M800 488H1060V516M540 716V741H800V766M1060 716V741H800M800 932V964M800 1130V1162M800 1328V1360"/>

  <rect x="400" y="340" width="800" height="124" rx="8" fill="#273039" filter="url(#shadow)"/>
  <text x="440" y="389" font-size="34" font-weight="700" fill="#ffffff">Try the complete stack</text>
  <text x="440" y="431" font-size="25" fill="#dceee6">#98307  /  Integration draft for end-to-end testing</text>

  <g filter="url(#shadow)">
    <rect x="290" y="516" width="495" height="200" rx="8" fill="#ffffff" stroke="#d3ddd8"/>
    <rect x="815" y="516" width="495" height="200" rx="8" fill="#ffffff" stroke="#d3ddd8"/>
  </g>
  <rect x="313" y="538" width="37" height="37" rx="6" fill="#efeaf6"/>
  <text x="324" y="566" class="number" fill="#745699">5</text>
  <text x="367" y="564" font-size="28" font-weight="700" fill="#22332e">Files and Bot-to-Bot handoff</text>
  <text x="318" y="612" class="body">Share, find, and retrieve files.</text>
  <text x="318" y="652" class="ref">#98072 + #99159  /  Ready for review</text>
  <text x="318" y="690" font-size="20" fill="#3b6657">UI #104199 + Classic #104198: ready</text>

  <rect x="838" y="538" width="37" height="37" rx="6" fill="#e6f0f5"/>
  <text x="849" y="566" class="number" fill="#386c87">6</text>
  <text x="892" y="564" font-size="31" font-weight="700" fill="#22332e">Control from messaging</text>
  <text x="843" y="612" class="body">Send, approve, Stop, or get files.</text>
  <text x="843" y="652" class="ref">#98073  /  Ready for review</text>
  <text x="843" y="690" font-size="22" fill="#52665c">Scoped approvals: verified in Telegram.</text>

  <g filter="url(#shadow)"><rect x="220" y="766" width="1160" height="166" rx="8" fill="#ffffff" stroke="#d3ddd8"/></g>
  <rect x="249" y="797" width="40" height="40" rx="6" fill="#e6f0f5"/>
  <text x="262" y="826" class="number" fill="#386c87">4</text>
  <text x="312" y="827" class="heading">Automatic Desktop continuity</text>
  <text x="249" y="871" class="body">Create a Group Chat normally. Hermes shows when Desktop is still needed.</text>
  <text x="249" y="908" class="ref">#97846  /  Desktop-only; maintainer review deferred</text>

  <g filter="url(#shadow)"><rect x="150" y="964" width="1300" height="166" rx="8" fill="#ffffff" stroke="#d3ddd8"/></g>
  <rect x="179" y="995" width="40" height="40" rx="6" fill="#e5f1e9"/>
  <text x="192" y="1024" class="number" fill="#2a7757">3</text>
  <text x="242" y="1025" class="heading">Work across gateways</text>
  <text x="179" y="1069" class="body">Bots on different hosts exchange tasks and replies without a Desktop relay.</text>
  <text x="179" y="1106" class="ref">#99244  /  Route recovery: #100016</text>
  <rect x="1270" y="996" width="144" height="37" rx="6" fill="#e5f1e9"/>
  <text x="1295" y="1022" class="status" fill="#286344">On main</text>

  <g filter="url(#shadow)"><rect x="95" y="1162" width="1410" height="166" rx="8" fill="#ffffff" stroke="#d3ddd8"/></g>
  <rect x="124" y="1193" width="40" height="40" rx="6" fill="#e5f1e9"/>
  <text x="137" y="1222" class="number" fill="#2a7757">2</text>
  <text x="187" y="1223" class="heading">Work on one gateway</text>
  <text x="124" y="1267" class="body">Bots sharing a host keep working there after Desktop closes.</text>
  <text x="124" y="1304" class="ref">#99099</text>
  <rect x="1325" y="1194" width="144" height="37" rx="6" fill="#e5f1e9"/>
  <text x="1350" y="1220" class="status" fill="#286344">On main</text>

  <g filter="url(#shadow)"><rect x="40" y="1360" width="1520" height="166" rx="8" fill="#ffffff" stroke="#d3ddd8"/></g>
  <rect x="69" y="1391" width="40" height="40" rx="6" fill="#e5f1e9"/>
  <text x="82" y="1420" class="number" fill="#2a7757">1</text>
  <text x="132" y="1421" class="heading">Shared history and safe recovery</text>
  <text x="69" y="1465" class="body">One ordered conversation, replayed safely when clients return.</text>
  <text x="69" y="1502" class="ref">#99007 + #99047  /  Passive-replica safety: #99107</text>
  <rect x="1380" y="1392" width="144" height="37" rx="6" fill="#e5f1e9"/>
  <text x="1405" y="1418" class="status" fill="#286344">On main</text>

  <text x="80" y="1594" font-size="25" fill="#334d40">Today, the coordinating host must stay online. Automatic takeover is not enabled.</text>
  <text x="80" y="1640" font-size="24" fill="#56616b">#97681 links source PRs and exact test evidence. Files menus require the complete stack.</text>
  </g>
</svg>
