<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1720" viewBox="0 0 1800 1720">
  <rect width="1800" height="1720" fill="#f6f8fa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#20262d">
    <text x="100" y="100" font-size="52" font-weight="700">Group Chats that keep working together</text>
    <text x="100" y="156" font-size="30" fill="#56616d">Six layers, one experience across your gateways and clients</text>
    <path d="M900 1410V385M900 660H617V650M900 660H1183V650" fill="none" stroke="#aab5c0" stroke-width="5"/>

    <rect x="405" y="222" width="990" height="172" rx="8" fill="#233740"/>
    <text x="455" y="283" fill="#fff" font-size="39" font-weight="700">Complete integration field build</text>
    <text x="455" y="333" fill="#dde8eb" font-size="28">Desktop, messages, files, and Bot-to-Bot handoff</text>
    <text x="455" y="371" fill="#dde8eb" font-size="25">#98307 · Available for end-to-end testing</text>

    <g>
      <rect x="350" y="435" width="535" height="215" rx="8" fill="#fff" stroke="#d6dde3" stroke-width="2"/>
      <rect x="350" y="435" width="8" height="215" fill="#6f65a7"/>
      <text x="382" y="483" font-size="28" fill="#6f65a7" font-weight="700">5</text>
      <text x="425" y="483" font-size="32" font-weight="700">Files and Bot-to-Bot</text>
      <text x="425" y="525" font-size="32" font-weight="700">handoff</text>
      <text x="382" y="574" font-size="24" fill="#56616d">Share verified files with Bots and people.</text>
      <text x="382" y="618" font-size="24" fill="#276785">#98072 · #99159 · In review</text>

      <rect x="915" y="435" width="535" height="215" rx="8" fill="#fff" stroke="#d6dde3" stroke-width="2"/>
      <rect x="915" y="435" width="8" height="215" fill="#27809a"/>
      <text x="947" y="483" font-size="28" fill="#27809a" font-weight="700">6</text>
      <text x="990" y="483" font-size="32" font-weight="700">Messaging control</text>
      <text x="947" y="533" font-size="24" fill="#56616d">Check activity, send messages, retrieve</text>
      <text x="947" y="570" font-size="24" fill="#56616d">files, handle approvals, and Stop.</text>
      <text x="947" y="618" font-size="24" fill="#276785">#98073 · Draft / field testing</text>
    </g>

    <rect x="295" y="700" width="1210" height="172" rx="8" fill="#fff" stroke="#d6dde3" stroke-width="2"/>
    <rect x="295" y="700" width="8" height="172" fill="#687aa4"/>
    <text x="332" y="754" font-size="30" fill="#687aa4" font-weight="700">4</text>
    <text x="386" y="754" font-size="35" font-weight="700">Automatic Desktop continuity</text>
    <text x="332" y="804" font-size="27" fill="#56616d">Choose a Group Chat normally; Hermes selects the supported continuity path.</text>
    <text x="332" y="847" font-size="25" fill="#276785">#97846 · In review</text>

    <rect x="230" y="917" width="1340" height="172" rx="8" fill="#fff" stroke="#d6dde3" stroke-width="2"/>
    <rect x="230" y="917" width="8" height="172" fill="#238267"/>
    <text x="267" y="971" font-size="30" fill="#238267" font-weight="700">3</text>
    <text x="321" y="971" font-size="35" font-weight="700">Cross-gateway work</text>
    <text x="267" y="1021" font-size="27" fill="#56616d">Bots on different gateways exchange tasks and replies.</text>
    <text x="267" y="1064" font-size="25" fill="#238267">Core landed · #99244 · Route hardening in #100016</text>

    <rect x="165" y="1134" width="1470" height="172" rx="8" fill="#fff" stroke="#d6dde3" stroke-width="2"/>
    <rect x="165" y="1134" width="8" height="172" fill="#238267"/>
    <text x="202" y="1188" font-size="30" fill="#238267" font-weight="700">2</text>
    <text x="256" y="1188" font-size="35" font-weight="700">Same-gateway work</text>
    <text x="202" y="1238" font-size="27" fill="#56616d">The gateway drives the conversation, so its Bots can continue after Desktop closes.</text>
    <text x="202" y="1281" font-size="25" fill="#238267">Core landed · #99099</text>

    <rect x="100" y="1351" width="1600" height="172" rx="8" fill="#fff" stroke="#d6dde3" stroke-width="2"/>
    <rect x="100" y="1351" width="8" height="172" fill="#238267"/>
    <text x="137" y="1405" font-size="30" fill="#238267" font-weight="700">1</text>
    <text x="191" y="1405" font-size="35" font-weight="700">Shared history and recovery</text>
    <text x="137" y="1455" font-size="27" fill="#56616d">One durable history, clear ownership, and safe replay when clients return.</text>
    <text x="137" y="1498" font-size="25" fill="#238267">Core landed · #99007 / #99047 · Safety refinement in #99107</text>

    <text x="100" y="1600" font-size="25" fill="#56616d">The gateway hosting the shared history must stay online. Older gateways can use Desktop.</text>
    <text x="100" y="1650" font-size="25" fill="#56616d">Issue #97681 contains the current PR heads, test evidence, and field-testing status.</text>
  </g>
</svg>
