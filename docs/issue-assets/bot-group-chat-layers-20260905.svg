<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1870" viewBox="0 0 1800 1870" role="img" aria-labelledby="title desc">
<title id="title">Six reviewable layers for lasting Bot Group Chats</title>
<desc id="desc">A widening vertical stack. Shared history, same-gateway work and cross-gateway transport are on main. Desktop continuity, Files and Bot-to-Bot handoff, and messaging control are separately reviewable. Safe automatic takeover after the coordinator host fails is a future milestone, not part of this build.</desc>
<rect width="1800" height="1870" fill="#f7f9fa"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="100" y="103" font-size="52" fill="#202a30" font-weight="700">Group Chats that keep working together</text>
<text x="100" y="160" font-size="31" fill="#53616a" font-weight="400">One experience. Six separately reviewable layers.</text>
<path d="M900 1480V364M900 691H617V640M900 691H1183V640" fill="none" stroke="#b7c4cb" stroke-width="4"/>
<rect x="440" y="220" width="920" height="154" rx="8" fill="#243c45" stroke="#d9e2e7" stroke-width="2"/>
<text x="483" y="275" font-size="38" fill="#fff" font-weight="700">The complete field build</text>
<text x="483" y="325" font-size="30" fill="#e1edef" font-weight="400">#98307 · Run and test the experience end to end</text>
<rect x="350" y="418" width="535" height="254" rx="8" fill="#fff" stroke="#d9e2e7" stroke-width="2"/><rect x="350" y="418" width="8" height="254" rx="3" fill="#7167a0"/>
<text x="385" y="472" font-size="31" fill="#7167a0" font-weight="700">5</text><text x="433" y="472" font-size="34" fill="#202a30" font-weight="700">Files and Bot-to-Bot</text>
<text x="433" y="515" font-size="34" fill="#202a30" font-weight="700">handoff</text>
<text x="385" y="567" font-size="29" fill="#53616a" font-weight="400">Share, find and retrieve real files.</text>
<text x="385" y="609" font-size="27" fill="#52668e" font-weight="400">#98072 · #99159 · In review</text>
<text x="385" y="646" font-size="24" fill="#52668e" font-weight="400">Files UI + classic: fork drafts #1 / #2</text>
<rect x="915" y="418" width="535" height="254" rx="8" fill="#fff" stroke="#d9e2e7" stroke-width="2"/><rect x="915" y="418" width="8" height="254" rx="3" fill="#267b8b"/>
<text x="950" y="472" font-size="31" fill="#267b8b" font-weight="700">6</text><text x="998" y="472" font-size="34" fill="#202a30" font-weight="700">Messaging control</text>
<text x="950" y="530" font-size="29" fill="#53616a" font-weight="400">Check in, send, approve, get files,</text>
<text x="950" y="569" font-size="29" fill="#53616a" font-weight="400">or Stop from a connected chat.</text>
<text x="950" y="631" font-size="27" fill="#267b8b" font-weight="400">#98073 · Draft in field testing</text>
<rect x="280" y="714" width="1240" height="180" rx="8" fill="#fff" stroke="#d9e2e7" stroke-width="2"/><rect x="280" y="714" width="8" height="180" rx="3" fill="#52668e"/><text x="318" y="769" font-size="32" fill="#52668e" font-weight="700">4</text><text x="369" y="769" font-size="38" fill="#202a30" font-weight="700">Automatic Desktop continuity</text><text x="318" y="821" font-size="30" fill="#53616a" font-weight="400">Create a Group Chat normally. Hermes shows when Desktop is still needed.</text><text x="318" y="865" font-size="28" fill="#52668e" font-weight="400">#97846 · Desktop-only client in review</text>
<rect x="210" y="936" width="1380" height="180" rx="8" fill="#fff" stroke="#d9e2e7" stroke-width="2"/><rect x="210" y="936" width="8" height="180" rx="3" fill="#238267"/><text x="248" y="991" font-size="32" fill="#238267" font-weight="700">3</text><text x="299" y="991" font-size="38" fill="#202a30" font-weight="700">Work across gateways</text><text x="248" y="1043" font-size="30" fill="#53616a" font-weight="400">Bots on different hosts exchange tasks and replies without Desktop relaying them.</text><text x="248" y="1087" font-size="28" fill="#238267" font-weight="400">On main · #99244 · Route repairs separately in #100016</text>
<rect x="140" y="1158" width="1520" height="180" rx="8" fill="#fff" stroke="#d9e2e7" stroke-width="2"/><rect x="140" y="1158" width="8" height="180" rx="3" fill="#238267"/><text x="178" y="1213" font-size="32" fill="#238267" font-weight="700">2</text><text x="229" y="1213" font-size="38" fill="#202a30" font-weight="700">Work on one gateway</text><text x="178" y="1265" font-size="30" fill="#53616a" font-weight="400">Bots sharing a gateway keep working there after Desktop closes.</text><text x="178" y="1309" font-size="28" fill="#238267" font-weight="400">On main · #99099</text>
<rect x="70" y="1380" width="1660" height="180" rx="8" fill="#fff" stroke="#d9e2e7" stroke-width="2"/><rect x="70" y="1380" width="8" height="180" rx="3" fill="#238267"/><text x="108" y="1435" font-size="32" fill="#238267" font-weight="700">1</text><text x="159" y="1435" font-size="38" fill="#202a30" font-weight="700">Shared history and safe recovery</text><text x="108" y="1487" font-size="30" fill="#53616a" font-weight="400">One ordered history, retained by gateways and replayed when clients return.</text><text x="108" y="1531" font-size="28" fill="#238267" font-weight="400">Core on main · #99007 / #99047 · Passive-replica safety in #99107</text>
<text x="100" y="1640" font-size="30" fill="#202a30" font-weight="700">Next milestone: survive loss of the coordinating host</text>
<text x="100" y="1687" font-size="28" fill="#53616a" font-weight="400">Planned, not enabled here. Today, that host must stay available for work to continue.</text>
<text x="100" y="1765" font-size="28" fill="#53616a" font-weight="400">#97681 has the current source drafts, test evidence and remaining acceptance gates.</text>
<text x="100" y="1810" font-size="27" fill="#53616a" font-weight="400">Contributor fork: #1 Desktop Files; #2 classic Bot file sharing. Both are linked in #97681.</text>
</g>
</svg>
